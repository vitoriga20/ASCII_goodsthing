<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071008" />
    <title>ASCII Globe · Planetary Signal</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div>
          <p>ASCII GLOBE / LIVE RENDERER</p>
          <h1>PLANETARY SIGNAL</h1>
        </div>
        <output id="status" aria-live="polite">SYSTEM READY</output>
      </header>

      <section class="globe-stage" aria-label="可拖拽的 ASCII 地球">
        <pre id="globe" tabindex="0" aria-label="拖拽以旋转地球"></pre>
      </section>

      <section class="instrument-deck" aria-label="渲染参数">
        <label class="speed-dial" for="speed">
          <span>SPEED</span>
          <output id="speed-readout">0.70</output>
          <input id="speed" type="range" min="0" max="3" step="0.05" value="0.7" />
        </label>

        <div class="readout-stack">
          <label>SCALE <input id="size" type="number" min="0.6" max="2" step="0.1" value="1.1" /></label>
          <label>TILT <input id="tilt" type="number" min="-90" max="90" step="0.5" value="23.5" /></label>
          <label>LAND <input id="land" maxlength="1" value="#" /></label>
          <label>WATER <input id="water" maxlength="1" value="-" /></label>
        </div>

        <div class="action-stack">
          <label>MAP
            <select id="map">
              <option value="earth">EARTH</option>
              <option value="death-star">DEATH STAR</option>
            </select>
          </label>
          <button id="toggle" type="button">PAUSE</button>
          <button id="reset" type="button">RESET</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
